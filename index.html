<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7A2419" />
    <title>Nellai Vishnu Snacks — Traditional Tamil Nadu Snacks</title>
    <meta
      name="description"
      content="Nellai Vishnu Snacks — traditional Tamil Nadu snacks and sweets. Browse the menu and order directly on WhatsApp."
    />
    <link rel="icon" type="image/png" href="/images/nellai-vishnu-logo.png" />
    <meta property="og:title" content="Nellai Vishnu Snacks" />
    <meta property="og:description" content="Browse the Nellai Vishnu Snacks catalogue and contact the shop directly." />
    <meta property="og:type" content="website" />

    <!--
      Type system (only the weights the site actually uses are requested):
      - Alfa Slab One 400: brand/display (hero, section headings)
      - Lora 400: story/editorial copy
      - Mukta 400/600/700: functional UI (nav, buttons, prices, product data)
      - Kalam 400: sparing Latin-script handwritten accents
      - Catamaran 700: functional Tamil (nav subtitle)
      - Baloo Thambi 2 600: Tamil display (shop-signage treatment)
      Google Fonts serves unicode-range subsets, so the Tamil files only
      download when Tamil text is on the page.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Lora:wght@400&family=Mukta:wght@400;600;700&family=Kalam:wght@400&family=Catamaran:wght@700&family=Baloo+Thambi+2:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
